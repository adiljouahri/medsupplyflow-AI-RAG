version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medsupply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-password}
      POSTGRES_DB: medsupplyflow
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medsupply -d medsupplyflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:1.5.10.dev326
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse-password}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:3
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse-password}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-my-super-secret-nextauth-token-12345}
      SALT: ${SALT:-my-super-secret-salt-12345}
      TELEMETRY_ENABLED: "false"

  worker:
    build: .
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+psycopg://medsupply:${POSTGRES_PASSWORD:-demo-password}@postgres:5432/medsupplyflow
      REDIS_URL: redis://redis:6379/0
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://medsupply:${POSTGRES_PASSWORD:-demo-password}@postgres:5432/medsupplyflow
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-demo-internal-api-key}
      CONFIDENCE_THRESHOLD: 0.85
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      MAX_ROWS: ${MAX_ROWS:-500}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MULTI_VECTOR_MODEL: ${MULTI_VECTOR_MODEL:-lightonai/mLateOn}
      VISUAL_MODEL: ${VISUAL_MODEL:-vidore/colpali-v1.3}
      REDIS_URL: redis://redis:6379/0
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-true}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      redis:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:1.123.100
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/n8n
      - ./n8n/workflows:/opt/workflows:ro
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "demo-user"
      N8N_BASIC_AUTH_PASSWORD: "demo-password"
      N8N_HOST: "localhost"
      N8N_PORT: "5678"
      API_BASE_URL: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy

  ui:
    build: ./ui
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_BASE_URL: http://api:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-demo-internal-api-key}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  chroma_data:
  n8n_data:
  redis_data:
  langfuse_pg_data:
