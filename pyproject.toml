[project]
name = "medsupplyflow-ai"
version = "0.1.0"
description = "Dockerized AI automation for synthetic surgical catalog ingestion, action-based agents, multilingual requests, and clinic isolation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.1.0",
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "litellm>=1.5.0",
  "chromadb>=0.5.0",
  "python-multipart>=0.0.19",
  "tenacity>=8.2.0",
  "httpx>=0.27.0",
  "openpyxl>=3.0.0",
  "pymupdf>=1.24.0",
  "pytesseract>=0.3.10",
  "pillow>=10.0.0",
  "requests>=2.31.0",
  "pytest>=8.0.0",
  "langdetect>=1.0.0",
]

[project.optional-dependencies]
advanced = [
  "sentence-transformers[image]==6.0.0",
  "torch>=2.2.0",
  "transformers>=5.0.0",
  "huggingface-hub>=1.0.0",
]
ui = ["streamlit>=1.35.0"]
eval = ["deepeval>=0.5.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# The repo also contains ui/, n8n/, and sample_data/, so setuptools' flat-layout
# auto-discovery refuses to guess. Ship only the application package.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares its dependency injection through argument defaults.
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Query",
]
